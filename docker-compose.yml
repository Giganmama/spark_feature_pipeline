version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: greenplum_sim
    environment:
      POSTGRES_USER: sber_de
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: feature_store
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
